[package]
name = "leptos_video"
version = "0.1.0"
edition = "2024"


[dependencies]
leptos = { version = "0.8.13", features = ["csr"] }
leptos_router = "0.8.10"
console_error_panic_hook = "0.1"
leptos_meta = "0.8.5"
console_log = "1"
log = "0.4"
wasm-bindgen = "0.2.106"
js-sys = "0.3.82"
web-sys = { version = "0.3.82", features = [
    "DomRect",
    "Element",
    "Event",
    "ProgressEvent",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "CanvasRenderingContext2d",
    "MediaStream",
    "TimeRanges",
    "VideoPlaybackQuality",
    "ClipboardEvent",
] }
leptos-use = { version = "0.16.3", features = [
    "use_draggable",
    "use_timeout_fn",
    "use_element_size",
    "use_debounce_fn",
    "use_throttle_fn",
    "use_mouse_in_element",
    "use_event_listener",
] }
# leptos_icons = "0.7.0"
send_wrapper = "0.6.0"
serde = "1.0.228"
serde_json = "1.0.145"
regex = {version="1.12.2", default-features = false}
web-time = "1.1.0"
smart-default = "0.7.1"
# icondata = "0.6.0"


[dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window"] }

[build-dependencies]
reqwest = {version="0.12", features=["blocking"]}


[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
